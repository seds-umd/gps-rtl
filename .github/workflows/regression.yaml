name: Regression Tests

on: [push]

env:
  PY_VER: "3.10"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  run_tests:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: sbt

    - uses: sbt/setup-sbt@v1

    - name: Set up Python ${{ env.PY_VER }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PY_VER }}

    - name: Install dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GH_CLONE_TOKEN }}
      run: pip install -r requirements/github-actions.txt --force-reinstall

    - name: Run tests
      run: ./hw/tb/run_all.sh

    - name: Test Summary
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Report
        path: "hw/tb/*/sim_build/results.xml"
        reporter: swift-xunit
